set noparent
linelength=120
root=..
# Checks that misfire on modern C++: clang-format's aligned initializers are
# reported as namespace indentation, and `if (init; cond) stmt;` as multiple
# statements. C++ version headers are checked by the compiler instead.
filter=-build/c++11,-build/c++17,-build/c++20,-whitespace/indent_namespace,-readability/braces
